<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No internet – CA Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; padding: 24px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px 24px; max-width: 360px; width: 100%; text-align: center; }
  .icon { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px; background: #eff6ff; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #64748b; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
  button { width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; background: #1e293b; color: #fff; }
  .hint { margin-top: 14px; font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
    </div>
    <h1>No internet connection</h1>
    <p>CA Dashboard needs the internet to show your firm's live data. Check Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="retry()">Try again</button>
    <div class="hint" id="hint">Will retry automatically when you are back online.</div>
  </div>
<script>
  function retry() { location.href = 'https://app.kuhu.org.in/home'; }
  window.addEventListener('online', retry);
</script>
</body>
</html>
