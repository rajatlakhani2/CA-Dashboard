# Builds the Android app (mobile/) and, on master, publishes it at
#   https://app.kuhu.org.in/downloads/ca-dashboard.apk
# The app loads the live website, so ordinary website changes do NOT need a new build.
# This runs only when the app shell itself changes (mobile/**), or when started by hand.
#
# Optional repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#       Release signing key. Without them the build uses mobile/android/app/fallback-signing.jks.
#   GOOGLE_SERVICES_JSON
#       Contents of google-services.json from Firebase. Without it push notifications stay off.
# Upload to the server reuses the production secrets SSH_HOST, SSH_USER, SSH_KEY, SSH_PORT, DEPLOY_PATH.

name: Android App

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'rajatlakhani2/CA-Dashboard'
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "push=on" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No GOOGLE_SERVICES_JSON secret: push notifications are off in this build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signed with the release key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signed with the fallback key (add ANDROID_KEYSTORE_* secrets for Play Store builds)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build APK and App Bundle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ca-dashboard.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/ca-dashboard.aab"
          printf '{"version":"%s","build":%s,"built_at":"%s"}\n' "$APP_VERSION_NAME" "$APP_VERSION_CODE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$GITHUB_WORKSPACE/ca-dashboard-apk.json"

      - name: Keep build files
        uses: actions/upload-artifact@v4
        with:
          name: ca-dashboard-android-${{ github.run_number }}
          path: |
            ca-dashboard.apk
            ca-dashboard.aab
            ca-dashboard-apk.json

      - name: Upload APK to the website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: ca-dashboard.apk,ca-dashboard-apk.json
          target: ${{ secrets.DEPLOY_PATH }}/public/downloads
